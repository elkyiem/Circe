name: Circé web

on:
  push:
    branches: [web, dev]
  pull_request:
    branches: [web, dev]

concurrency:
  group: circe-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @pond/desktop build:web
      - run: pnpm --filter @pond/extension build:circe
      - name: Isolated host and browser workflows
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a node apps/desktop/scripts/smoke-web-ci.mjs
      - name: Compare native and browser upstream features
        run: xvfb-run -a pnpm --filter @pond/desktop smoke:upstream-parity
      - name: Preserve failed fixture screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: circe-browser-failure
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .artifacts/web-verification/upstream-*/*-failed.*
            .artifacts/web-verification/failed.png
            .artifacts/web-verification/failed.txt
            .artifacts/web-verification/library-identity-failed.png
            .artifacts/web-verification/library-identity-failed.txt
            .artifacts/web-verification/upgrade220-fish-failure.png
            .artifacts/web-verification/upgrade220-fish-failure.txt
            .artifacts/web-verification/upgrade220-sources-failure.png
            .artifacts/web-verification/upgrade220-sources-failure.txt
            .artifacts/web-verification/pairing-browser-failed.png
            .artifacts/web-verification/pairing-browser-failed.txt
            .artifacts/web-verification/pairing-owner-failed.png
            .artifacts/web-verification/pairing-owner-failed.txt
