name: Circé web

on:
  push:
    branches: [web, dev]
  pull_request:
    branches: [web, dev]

concurrency:
  group: circe-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @pond/desktop build:web
      - run: pnpm --filter @pond/extension build:circe
      - name: Desktop, browser, and shared feature E2E
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a pnpm e2e:ci
      - name: Preserve E2E reports, logs, and fixture screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: circe-e2e
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .artifacts/e2e/
            .artifacts/web-verification/
